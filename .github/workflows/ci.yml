name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck application
        run: bun run typecheck
      - name: Typecheck smoke harness
        run: bun run typecheck:scripts
      - name: Run unit tests
        run: bun test
      - name: Check for common issues
        run: |
          echo "Running basic quality checks..."
          # Check for TODO/FIXME
          grep -r "TODO\|FIXME" --include="*.ts" --include="*.js" --include="*.py" --include="*.tsx" . || echo "No TODOs/FIXMEs found"
